name: Build

# Builds plain DSView (the upstream code with no branding) and Logic Analyze,
# runs the hardware-free checks and packages the app. The upstream sync
# workflow calls this on its merge branch before it opens a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies
        run: .github/scripts/brew-deps.sh

      - name: Build plain DSView
        run: |
          cmake -S . -B build-plain -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 $(.github/scripts/python-pin.sh)
          cmake --build build-plain -j"$(sysctl -n hw.ncpu)"
          # The plain build must not carry any of the Logic Analyze branding.
          # ("Logic Analyzer" is DSView's own mode name, so match the brand name exactly.)
          if strings build.dir/DSView | grep -E 'Logic Analyze($|[^r])|Lanscapes|LANScapes|main_toolbar'; then
            echo "::error::the plain build contains brand strings"; exit 1
          fi

      - name: dslcap spool test
        run: |
          cc -Ilibsigrok4DSL -Icommon $(pkg-config --cflags glib-2.0) tools/dslcap/test_spool.c \
            $(pkg-config --libs glib-2.0) -Wl,-dead_strip -o "$RUNNER_TEMP/test_spool"
          "$RUNNER_TEMP/test_spool" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/output.bin"

      - name: Build Logic Analyze
        run: |
          # The plain and branded builds share build.dir; start clean so the
          # package step sees only the branded binaries.
          rm -rf build.dir
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLANSCAPES_BRAND=ON $(.github/scripts/python-pin.sh)
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package (ad-hoc signed)
        # The runner's macOS is the oldest the Homebrew libraries in the bundle support.
        run: MIN_MACOS="$(sw_vers -productVersion | cut -d. -f1).0" packaging/macos/package.sh

      - name: Zip the app
        run: |
          version=$(sed -n 's/^BRAND_VERSION=//p' build.dir/brand.env)
          ditto -c -k --keepParent "dist/Logic Analyze.app" "dist/LogicAnalyze-$version-adhoc.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logic-analyze-adhoc
          path: dist/LogicAnalyze-*-adhoc.zip
          retention-days: 14
